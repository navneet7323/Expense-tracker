<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">

                <!-- App Header & Card -->
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <h2 class="card-title text-center mb-4 text-primary fw-bold">Expense Tracker</h2>

                        <!-- Expense Form -->
                        <form id="expenseForm">

                            <!-- Expense Amount -->
                            <div class="mb-3">
                                <label for="expenseAmount" class="form-label fw-semibold">Choose Expense Amount:</label>
                                <input type="number" class="form-control" id="expenseAmount" placeholder="e.g. 500"
                                    required>
                            </div>

                            <!-- Choose Description -->
                            <div class="mb-3">
                                <label for="expenseDescription" class="form-label fw-semibold">Choose
                                    Description:</label>
                                <input type="text" class="form-control" id="expenseDescription"
                                    placeholder="e.g. Groceries, Movie" required>
                            </div>

                            <!-- Choose Category -->
                            <div class="mb-3">
                                <label for="expenseCategory" class="form-label fw-semibold">Choose a Category:</label>
                                <select class="form-select" id="expenseCategory" required>
                                    <option value="" selected disabled>Select Category</option>
                                    <option value="Fuel">Fuel</option>
                                    <option value="Food">Food</option>
                                    <option value="Electricity">Electricity</option>
                                    <option value="Movie">Movie</option>
                                    <option value="Shopping">Shopping</option>
                                </select>
                            </div>

                            <!-- Submit Button -->
                            <button type="submit" class="btn btn-primary w-100 fw-bold py-2">Add Expense</button>
                        </form>

                    </div>
                </div>

                <!-- Expenses Output List -->
                <div class="mt-4">
                    <h4 class="fw-bold mb-3 text-secondary">Expenses Added</h4>
                    <ul class="list-group shadow-sm" id="listOfExpenses">
                        <!-- Dynamic expense items will appear here -->
                    </ul>
                </div>

            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script src="script.js"></script>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
